<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tourism Horizontal Stacked Cards</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

/* body{
    font-family: Arial, sans-serif;
    background:#111;
    color:#fff;
    overflow-x:auto;
    overflow-y:hidden;
} */

header{
    text-align:center;
    padding:40px 20px;
}

header h1{
    font-size:60px;
    letter-spacing:4px;
}


.container{
    display:flex;
    align-items:center;
    height:80vh;
    width:max-content;
    padding:20px 80px;
}


.card{
    width:420px;
    height:520px;
    border-radius:25px;
    overflow:hidden;
    background:#222;
    box-shadow:0 20px 40px rgba(0,0,0,0.5);

    position:sticky;
    left:80px;              /* horizontal sticky */

    margin-left:-140px;     /* overlap effect */
}

.card:first-child{
    margin-left:0;
}

.card img{
    width:100%;
    height:440px;
    object-fit:cover;
    display:block;
}

.card h2{
    text-align:center;
    padding:18px;
    font-size:28px;
    background:#fff;
    color:#111;
}
</style>
</head>
<body>

<header>
    <h1>Tourism</h1>
</header>

<div class="container">

    <div class="card">
        <img src="https://images.unsplash.com/photo-1564507592333-c60657eea523?w=1200&q=80" alt="Taj Mahal">
        <h2>Taj Mahal</h2>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1477587458883-47145ed94245?w=1200&q=80" alt="Jaipur">
        <h2>Jaipur</h2>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1524492412937-b28074a5d7da?w=1200&q=80" alt="Varanasi">
        <h2>Varanasi</h2>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1512453979798-5ea266f8880c?w=1200&q=80" alt="Goa">
        <h2>Goa</h2>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1200&q=80" alt="Kerala">
        <h2>Kerala</h2>
    </div>

</div>

</body>
</html>
