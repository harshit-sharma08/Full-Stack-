<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradient Box</title>

  <style>
    *{
      margin:0;
      padding:0;
    }

    body{
      height:100vh;
      display:flex;
      
      align-items:center;
      background:#111;
      font-family:Arial, sans-serif;
    }

    .box{
      width:500px;
      height:80px;
      border-radius:20px;
      background:linear-gradient(to right, #FFD700, #FFFFFF);
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:32px;
      font-weight:bold;
      color:#222;
      box-shadow:0 15px 35px rgba(0,0,0,0.4);
    }
  </style>
</head>

<body>

  <div class="box">
    Harshit Sharma
  </div>

</body>
</html>
