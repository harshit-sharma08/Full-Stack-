<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: 150px 150px;
            gap: 8px;
            outline: 1px solid black;

            grid-template-areas:
                "box1 box1 box2"
                "box3 box4 box6";
        }

        .container > div {
            font-size: 30px;
            outline: 1px dashed black;
        }
        .box1 { grid-area: box1; }
        .box2 { grid-area: box2; }
        .box3 { grid-area: box3; }
        .box4 { grid-area: box4; }
        /*.box5 { grid-area: box5; }*/
        .box6 { grid-area: box6; }
    </style>
</head>

<body>

    <div class="container">
        <div class="box1">1</div>
        <div class="box2">2</div>
        <div class="box3">3</div>
        <div class="box4">4</div>
        <div class="box5">5</div>
        <div class="box6">6</div>
    </div>

</body>
</html>
