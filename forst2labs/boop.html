<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temple Cards</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #111;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 500px;
      margin: 100px auto;
    }

    .card {
      height: 400px;
      position: sticky;
      top: 50px;
      margin-bottom: 100px;
      border-radius: 20px;
      box-shadow: 0 10px 30px #000;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    } 

  </style>
</head>

<body>

  <div class="container">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1548013146-72479768bada?w=800" alt="Temple">
      <h2>Temple 1</h2>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1606298855672-3efb63017be8?w=800" alt="Temple">
      <h2>Temple 2</h2>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1561361513-2d000a50f0dc?w=800" alt="Temple">
      <h2>Temple 3</h2>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1598091383021-15ddea10925d?w=800" alt="Temple">
      <h2>Temple 4</h2>
    </div>
    <div class="card">
      <img >
      <h2>Temple 4</h2>
    </div>


  </div>

</body>
</html>
